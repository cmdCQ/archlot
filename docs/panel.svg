<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" fill="none">
  <defs>
    <linearGradient id="desk" x1="0" y1="0" x2="760" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#161821"/>
      <stop offset=".55" stop-color="#101218"/>
      <stop offset="1" stop-color="#0A0B0F"/>
    </linearGradient>
    <linearGradient id="panel" x1="420" y1="40" x2="700" y2="460" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1A1C25"/>
      <stop offset="1" stop-color="#12141B"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(590 200) rotate(90) scale(260 190)">
      <stop stop-color="#7C3AED" stop-opacity=".22"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity=".55"/>
    </filter>
  </defs>

  <rect width="760" height="500" rx="22" fill="url(#desk)"/>
  <g opacity=".32" stroke="#FFFFFF" stroke-width="1">
    <path d="M0 100.5H760M0 200.5H760M0 300.5H760M0 400.5H760"/>
    <path d="M100.5 0V500M200.5 0V500M300.5 0V500M400.5 0V500M500.5 0V500M600.5 0V500M700.5 0V500"/>
  </g>
  <circle cx="590" cy="210" r="220" fill="url(#glow)"/>

  <!-- desktop hints -->
  <g opacity=".38">
    <rect x="48" y="64" width="270" height="150" rx="12" fill="#FFFFFF" fill-opacity=".035" stroke="#FFFFFF" stroke-opacity=".08"/>
    <rect x="64" y="82" width="96" height="9" rx="4.5" fill="#FFFFFF" fill-opacity=".18"/>
    <rect x="64" y="103" width="220" height="7" rx="3.5" fill="#FFFFFF" fill-opacity=".1"/>
    <rect x="64" y="119" width="180" height="7" rx="3.5" fill="#FFFFFF" fill-opacity=".1"/>
    <rect x="64" y="148" width="72" height="38" rx="9" fill="#FFFFFF" fill-opacity=".12"/>
    <rect x="48" y="238" width="270" height="190" rx="12" fill="#FFFFFF" fill-opacity=".025" stroke="#FFFFFF" stroke-opacity=".06"/>
    <rect x="64" y="258" width="150" height="8" rx="4" fill="#FFFFFF" fill-opacity=".12"/>
    <rect x="64" y="280" width="230" height="7" rx="3.5" fill="#FFFFFF" fill-opacity=".07"/>
    <rect x="64" y="297" width="205" height="7" rx="3.5" fill="#FFFFFF" fill-opacity=".07"/>
  </g>

  <!-- panel -->
  <g filter="url(#shadow)">
    <rect x="414" y="36" width="310" height="428" rx="18" fill="url(#panel)" stroke="#FFFFFF" stroke-opacity=".12"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <circle cx="438" cy="62" r="5" fill="url(#violet)"/>
    <text x="452" y="67" fill="#A1A1AA" font-size="10.5" font-weight="700" letter-spacing="1.8">ARCHLOT</text>
    <text x="700" y="67" text-anchor="end" fill="#52525B" font-size="10">niri · wayland</text>
    <path d="M430 82H708" stroke="#FFFFFF" stroke-opacity=".07"/>

    <!-- user -->
    <rect x="548" y="102" width="160" height="34" rx="10" fill="#FFFFFF" fill-opacity=".07"/>
    <text x="562" y="123" fill="#E4E4E7" font-size="12.5">fill this form, mouse first</text>

    <!-- assistant -->
    <text x="430" y="166" fill="#71717A" font-size="9.5" font-weight="700" letter-spacing="1.4">ARCHLOT</text>
    <text x="430" y="188" fill="#D4D4D8" font-size="12.5">On it. Let me grab a screenshot and</text>
    <text x="430" y="206" fill="#D4D4D8" font-size="12.5">find the first field.</text>

    <!-- tool card -->
    <rect x="430" y="224" width="278" height="76" rx="11" fill="#8B5CF6" fill-opacity=".08" stroke="#8B5CF6" stroke-opacity=".28"/>
    <circle cx="446" cy="242" r="4" fill="#A78BFA"/>
    <text x="458" y="246" fill="#C4B5FD" font-size="11" font-weight="650">screenshot</text>
    <text x="696" y="246" text-anchor="end" fill="#71717A" font-size="10">frame 18 · 1.0×</text>
    <text x="446" y="266" fill="#8B8B96" font-size="10.5">2048×1280 · grid 100px</text>
    <rect x="446" y="278" width="246" height="5" rx="2.5" fill="#FFFFFF" fill-opacity=".08"/>
    <rect x="446" y="278" width="246" height="5" rx="2.5" fill="url(#violet)" fill-opacity=".75"/>

    <rect x="430" y="310" width="278" height="54" rx="11" fill="#FFFFFF" fill-opacity=".035" stroke="#FFFFFF" stroke-opacity=".08"/>
    <text x="446" y="331" fill="#E4E4E7" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">click</text>
    <text x="696" y="331" text-anchor="end" fill="#71717A" font-size="10">(32, 597)</text>
    <text x="446" y="350" fill="#8B8B96" font-size="10.5">frame-bound · exact scale</text>

    <rect x="430" y="374" width="278" height="34" rx="10" fill="#34D399" fill-opacity=".08" stroke="#34D399" stroke-opacity=".22"/>
    <text x="446" y="395" fill="#6EE7B7" font-size="11">checkpoint saved</text>
    <text x="696" y="395" text-anchor="end" fill="#52525B" font-size="10">3 tools · 4.1s</text>

    <!-- input -->
    <rect x="430" y="420" width="278" height="30" rx="9" fill="#FFFFFF" fill-opacity=".045" stroke="#FFFFFF" stroke-opacity=".08"/>
    <text x="444" y="439" fill="#52525B" font-size="11">ask, or tell Archlot what to do</text>
    <circle cx="690" cy="435" r="9" fill="url(#violet)" fill-opacity=".85"/>
    <path d="M687 435H693M690 432V438" stroke="#0B0D12" stroke-width="1.6" stroke-linecap="round"/>
  </g>

  <text x="48" y="462" fill="#3F3F46" font-size="10.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">UI mockup — the real panel is a GTK4 window that sits on the right edge of your screen.</text>
</svg>
